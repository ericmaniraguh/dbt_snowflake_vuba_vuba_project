version: 2

sources:
  - name: vuba_system
    description: "Source system for Vuba data"
    database: VUBA_VUBA_DB
    schema: VUBA_SCHEMA
    
    tables:
      - name: customers
        identifier: "CUSTOMERS"
        description: "Raw customers data"
        
      - name: orders
        identifier: "ORDERS"
